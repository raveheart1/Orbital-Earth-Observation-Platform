[project]
name = "oeop-worker"
version = "0.1.0"
description = "Queue-driven NDVI processing worker"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "earth-observation",
    "oeop-core",
]

[project.scripts]
oeop-worker = "oeop_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oeop_worker"]
