[project]
name = "oeop-api"
version = "0.1.0"
description = "FastAPI application: analysis submission, status, artifacts, and provenance"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "earth-observation",
    "oeop-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "anyio>=4.6",
]

[project.scripts]
oeop-admin = "oeop_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oeop_api"]
