# Continuous integration: lint, typecheck, test, build — no cloud access.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --frozen

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy packages/earth_observation/src packages/platform_core/src apps/api/src apps/worker/src scripts

      - name: Pytest
        run: uv run pytest -q

  web:
    name: web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  terraform:
    name: terraform (fmt, validate, tflint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Format check
        run: terraform fmt -check -recursive
        working-directory: infra

      - name: Init (no backend)
        run: terraform init -backend=false
        working-directory: infra/environments/dev

      - name: Validate
        run: terraform validate
        working-directory: infra/environments/dev

      - uses: terraform-linters/setup-tflint@v4
        continue-on-error: true

      - name: TFLint
        continue-on-error: true
        working-directory: infra
        run: |
          tflint --init --config "${GITHUB_WORKSPACE}/.tflint.hcl"
          tflint --recursive --config "${GITHUB_WORKSPACE}/.tflint.hcl"

  docker:
    name: docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # api and worker need the whole uv workspace as build context.
          - image: oeop-api
            dockerfile: apps/api/Dockerfile
            context: .
          - image: oeop-worker
            dockerfile: apps/worker/Dockerfile
            context: .
          - image: oeop-web
            dockerfile: apps/web/Dockerfile
            context: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Synthetic satellite rasters are permitted in automated tests ONLY. The
      # generator (earth_observation.testing) is excluded from the wheel, and
      # the demo bundle under data/ is never copied in — assert both against
      # the real image rather than trusting the build config.
      - name: Assert the image contains no synthetic data
        run: |
          set -euo pipefail
          image="${{ matrix.image }}:${{ github.sha }}"
          echo "Inspecting $image for synthetic-data artifacts"
          found=$(docker run --rm --entrypoint sh "$image" -c \
            'find / -xdev \( -name "testing.py" -path "*earth_observation*" \) \
                     -o -path "*/data/demo/*" 2>/dev/null | head -20' || true)
          if [ -n "$found" ]; then
            echo "::error::Synthetic or precomputed demo data found in $image:"
            echo "$found"
            exit 1
          fi
          echo "OK: no synthetic satellite data in $image"

  secrets-scan:
    name: secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Full-history scan with a pinned gitleaks release. The CLI is invoked
      # directly (not via gitleaks-action) because the action derives a commit
      # range from the push event, which is invalid for a repository's initial
      # push (the root commit has no parent). Config: .gitleaks.toml at the
      # repo root (allowlists only Azurite's published development key).
      - name: Run gitleaks over the entire history
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --exit-code 1 -v
