[project]
name = "oeop-core"
version = "0.1.0"
description = "Platform core: settings, database models, Azure storage/queue clients, logging, telemetry"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "earth-observation",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "geoalchemy2>=0.16",
    "azure-identity>=1.19",
    "azure-storage-blob>=12.24",
    "azure-storage-queue>=12.12",
    "structlog>=24.4",
    "tenacity>=9.0",
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "azure-monitor-opentelemetry>=1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oeop_core"]
