[project]
name = "earth-observation"
version = "1.0.0"
description = "Scientific core: Sentinel-2 STAC discovery, SCL cloud masking, NDVI processing, COG outputs, and provenance"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "xarray>=2024.10",
    "rasterio>=1.4",
    "rioxarray>=0.18",
    "shapely>=2.0",
    "pyproj>=3.7",
    "geopandas>=1.0",
    "pystac>=1.11",
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    "rio-cogeo>=5.4",
    "pillow>=11.0",
    "tenacity>=9.0",
    "jsonschema>=4.23",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earth_observation"]
