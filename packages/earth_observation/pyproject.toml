[project]
name = "earth-observation"
version = "1.0.0"
description = "Scientific core: Sentinel-2 STAC discovery, SCL cloud masking, NDVI processing, COG outputs, and provenance"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "xarray>=2024.10",
    "rasterio>=1.4",
    "rioxarray>=0.18",
    "shapely>=2.0",
    "pyproj>=3.7",
    "geopandas>=1.0",
    "pystac>=1.11",
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    "rio-cogeo>=5.4",
    "pillow>=11.0",
    "tenacity>=9.0",
    "jsonschema>=4.23",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earth_observation"]
# earth_observation.testing GENERATES SYNTHETIC SATELLITE RASTERS. It exists
# purely so tests can exercise the pipeline without the network, and it must
# never reach a deployed environment: the platform's rule is that synthetic
# imagery is permitted in automated tests only, never in the running
# application.
#
# Excluding it from the wheel is what enforces that. Tests and local
# development install the workspace in EDITABLE mode, so they import it
# straight from src/ and are unaffected. Container images build with
# `uv sync --no-editable`, which installs this wheel — so the module is
# physically absent from the images deployed to Azure.
#
# `tests/test_no_synthetic_data_in_production.py` and the CI image check
# assert this stays true.
exclude = ["src/earth_observation/testing.py"]
